name: Nightly build

# GitHub Pages skips posts dated in the future, so a post only appears after the next build.
on:
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:

permissions:
  pages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Request a GitHub Pages build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/$GITHUB_REPOSITORY/pages/builds"
